# docker-compose.yml — Sovereign Node Inference Layer
#
# This compose file manages the inference backend only.
# ZeroClaw routes directly to the reasoning engine on localhost:8000.
#

services:
  # THE BRAIN: Gemma 4 26B A4B (via vLLM)
  reasoning-engine:
    image: ${VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin}
    network_mode: host
    shm_size: "16g"
    runtime: nvidia
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      - VLLM_SERVED_MODEL_NAME=${VLLM_SERVED_MODEL_NAME:-gemma-4-26b-a4b}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.75}
      - VLLM_EXTRA_ARGS=${VLLM_EXTRA_ARGS:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_DATASETS_OFFLINE=${HF_DATASETS_OFFLINE:-1}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${REASONING_ENGINE_DIR:-${HOME}/.cache/huggingface}:/data/models/huggingface
      - ./patches/gemma4_patch.py:/opt/venv/lib/python3.10/site-packages/vllm/model_executor/models/gemma4.py
      - ./patches/gemma4_mm_patch.py:/opt/venv/lib/python3.10/site-packages/vllm/model_executor/models/gemma4_mm.py
      - ./patches/fused_moe_patch.py:/opt/venv/lib/python3.10/site-packages/vllm/lora/layers/fused_moe.py
    command: ["bash", "-c", "vllm serve $$VLLM_MODEL --served-model-name $$VLLM_SERVED_MODEL_NAME --gpu-memory-utilization $$VLLM_GPU_MEMORY_UTILIZATION $$VLLM_EXTRA_ARGS --port 8000"]
    restart: unless-stopped

  # THE OPERATOR AGENT (Supervised, General Access)
  #
  # Both agents run as the image's unprivileged 'uplift' user (stack/Dockerfile.zeroclaw),
  # and spawned commands run under ZeroClaw's Landlock sandbox ([risk_profiles.default]
  # in the config templates). Host networking is kept for now because the configs reach the
  # vLLM proxy, browser node and telemetry MCP on 127.0.0.1. Moving to a bridge
  # network first needs the host vLLM proxy rebound and the configs repointed.
  #
  # Layout (ZeroClaw config schema V3): .zeroclaw-<tier>/ is the install root, holding
  # config.toml, data/ (state, sessions, memory), shared/ (skills) and
  # agents/default/workspace/. Per-turn uplift traces go to ./traces/<tier>/, outside
  # the state that scripts/neuralyzer.sh wipes.
  zeroclaw-operator:
    build:
      context: ./stack/zeroclaw
      dockerfile: ../Dockerfile.zeroclaw
    image: zeroclaw:latest
    network_mode: host
    environment:
      - ZEROCLAW_CONFIG_DIR=/zeroclaw-data/.zeroclaw
      - UPLIFT_TRACE_PATH=/zeroclaw-data/traces/uplift-trace.jsonl
    volumes:
      - ./.zeroclaw-operator:/zeroclaw-data/.zeroclaw
      - ./traces/operator:/zeroclaw-data/traces
      - ./scripts/zeroclaw_entrypoint.sh:/usr/local/bin/zeroclaw_entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/zeroclaw_entrypoint.sh"]
    command: ["daemon"]
    restart: unless-stopped
    depends_on:
      - reasoning-engine
      - browser-node
      - jetson-telemetry

  # THE ADMIN AGENT (Autonomous, Privileged Access)
  zeroclaw-admin:
    build:
      context: ./stack/zeroclaw
      dockerfile: ../Dockerfile.zeroclaw
    image: zeroclaw:latest
    network_mode: host
    environment:
      - ZEROCLAW_CONFIG_DIR=/zeroclaw-data/.zeroclaw
      - UPLIFT_TRACE_PATH=/zeroclaw-data/traces/uplift-trace.jsonl
      - ZEROCLAW_UI_THEME_CSS=/zeroclaw-data/admin-theme.css
    volumes:
      - ./.zeroclaw-admin:/zeroclaw-data/.zeroclaw
      - ./traces/admin:/zeroclaw-data/traces
      - ./.zeroclaw-operator/agents/default/workspace:/zeroclaw-data/operator_workspace
      # HOME is /zeroclaw-data, so this is the agent's ~/.ssh (the allowed root in
      # configs/zeroclaw-admin.toml.template). Read-only: known_hosts is populated
      # on the host, which pins host keys. Key restrictions: docs/ssh-setup.md.
      - ~/.zeroclaw/ssh:/zeroclaw-data/.ssh:ro
      - ./configs/admin-theme.css:/zeroclaw-data/admin-theme.css:ro
      - ./scripts/zeroclaw_entrypoint.sh:/usr/local/bin/zeroclaw_entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/zeroclaw_entrypoint.sh"]
    command: ["daemon"]
    restart: unless-stopped
    depends_on:
      - reasoning-engine
      - browser-node
      - jetson-telemetry

  # Selenium has no authentication, so it is published on loopback only; the
  # agents reach it at 127.0.0.1:4444 over host networking. The image is pinned
  # by digest (the 'latest' index as resolved on 2026-10-01).
  browser-node:
    image: seleniarm/standalone-chromium@sha256:d644a5f679e83e63344cee11c08fc2c7bf4acf43217434a8621a2bc85f7473a5
    shm_size: "2g"
    ports:
      - "127.0.0.1:4444:4444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  jetson-telemetry:
    build:
      context: ./stack/jetson-telemetry-mcp
    image: jetson-telemetry-mcp:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Streamable HTTP at /mcp; HTTP+SSE is deprecated by the MCP 2026-07-28 revision.
      - MCP_TRANSPORT=streamable-http
    volumes:
      - /sys:/sys:ro
      - /usr/bin/tegrastats:/usr/bin/tegrastats:ro
      - /usr/sbin/nvpmodel:/usr/sbin/nvpmodel:ro
      - /usr/bin/jetson_clocks:/usr/bin/jetson_clocks:ro
      - /dev:/dev:ro
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
    restart: unless-stopped
    privileged: true
