# docker-compose.yml — Sovereign Node Inference Layer
#
# This compose file manages the inference backend only.
# ZeroClaw routes directly to the reasoning engine on localhost:8000.
#

services:
  # THE BRAIN: Gemma 4 26B A4B (via vLLM)
  reasoning-engine:
    image: ${VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin}
    network_mode: host
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      - VLLM_SERVED_MODEL_NAME=${VLLM_SERVED_MODEL_NAME:-gemma-4-26b-a4b}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.75}
      - VLLM_EXTRA_ARGS=${VLLM_EXTRA_ARGS:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_DATASETS_OFFLINE=${HF_DATASETS_OFFLINE:-1}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${REASONING_ENGINE_DIR:-/home/lhzn/.cache/huggingface}:/data/models/huggingface
      - ./patches/gemma4_patch.py:/opt/venv/lib/python3.10/site-packages/vllm/model_executor/models/gemma4.py
      - ./patches/gemma4_mm_patch.py:/opt/venv/lib/python3.10/site-packages/vllm/model_executor/models/gemma4_mm.py
      - ./patches/fused_moe_patch.py:/opt/venv/lib/python3.10/site-packages/vllm/lora/layers/fused_moe.py
    command: ["bash", "-c", "vllm serve $$VLLM_MODEL --served-model-name $$VLLM_SERVED_MODEL_NAME --gpu-memory-utilization $$VLLM_GPU_MEMORY_UTILIZATION $$VLLM_EXTRA_ARGS --port 8000"]
    restart: unless-stopped

  # THE OPERATOR AGENT (Supervised, General Access)
  zeroclaw-operator:
    build:
      context: ./stack/zeroclaw
      dockerfile: ../Dockerfile.zeroclaw
    image: zeroclaw:latest
    user: "root"
    network_mode: host
    environment:
      - ZEROCLAW_CONFIG_DIR=/zeroclaw-data/.zeroclaw
      - ZEROCLAW_WORKSPACE=/zeroclaw-data/workspace
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-vllm}
      - ZEROCLAW_MODEL=${VLLM_SERVED_MODEL_NAME:-gemma-4-26b-a4b}
      - ZEROCLAW_GATEWAY_PORT=42617
      - ZEROCLAW_NO_SANDBOX=1
    volumes:
      - ./.zeroclaw-operator:/zeroclaw-data/.zeroclaw
      - ./.zeroclaw-operator/workspace:/zeroclaw-data/workspace
      - ./scripts/zeroclaw_entrypoint.sh:/usr/local/bin/zeroclaw_entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/zeroclaw_entrypoint.sh"]
    command: ["daemon"]
    restart: unless-stopped
    depends_on:
      - reasoning-engine
      - browser-node
      - jetson-telemetry

  # THE ADMIN AGENT (Autonomous, Privileged Access)
  zeroclaw-admin:
    build:
      context: ./stack/zeroclaw
      dockerfile: ../Dockerfile.zeroclaw
    image: zeroclaw:latest
    user: "root"
    network_mode: host
    environment:
      - ZEROCLAW_CONFIG_DIR=/zeroclaw-data/.zeroclaw
      - ZEROCLAW_WORKSPACE=/zeroclaw-data/workspace
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-vllm}
      - ZEROCLAW_MODEL=${VLLM_SERVED_MODEL_NAME:-gemma-4-26b-a4b}
      - ZEROCLAW_GATEWAY_PORT=42618
      - ZEROCLAW_NO_SANDBOX=1
    volumes:
      - ./.zeroclaw-admin:/zeroclaw-data/.zeroclaw
      - ./.zeroclaw-admin/workspace:/zeroclaw-data/workspace
      - ./.zeroclaw-operator/workspace:/zeroclaw-data/operator_workspace
      - ~/.zeroclaw/ssh:/home/lhzn/.ssh
      - ./configs/admin-index.html:/zeroclaw-data/web/dist/index.html:ro
      - ./scripts/zeroclaw_entrypoint.sh:/usr/local/bin/zeroclaw_entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/zeroclaw_entrypoint.sh"]
    command: ["daemon"]
    extra_hosts:
      - "karone.local:10.219.100.19"
    restart: unless-stopped
    depends_on:
      - reasoning-engine
      - browser-node
      - jetson-telemetry

  browser-node:
    image: seleniarm/standalone-chromium:latest
    shm_size: "2g"
    ports:
      - "4444:4444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  jetson-telemetry:
    build:
      context: ./stack/jetson-telemetry-mcp
    image: jetson-telemetry-mcp:latest
    ports:
      - "8765:8765"
    environment:
      - MCP_TRANSPORT=sse
    volumes:
      - /sys:/sys:ro
      - /usr/bin/tegrastats:/usr/bin/tegrastats:ro
      - /usr/sbin/nvpmodel:/usr/sbin/nvpmodel:ro
      - /usr/bin/jetson_clocks:/usr/bin/jetson_clocks:ro
      - /dev:/dev:ro
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
    restart: unless-stopped
    privileged: true
