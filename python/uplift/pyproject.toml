[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift"
version = "0.2.0"
description = "Uplift tracing and treatment effect estimation tools"
authors = [{name = "Uplift Core", email = "hello@uplift.ai"}]
dependencies = [
    "click>=8.0",
    "pandas>=1.0.0",
    "pyarrow>=10.0.0"
]

[project.scripts]
uplift = "uplift.cli:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
